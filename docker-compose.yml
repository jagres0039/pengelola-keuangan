services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
      POSTGRES_DB: ${POSTGRES_DB:-pengelola_keuangan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d ${POSTGRES_DB:-pengelola_keuangan}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD:-bot}@db:5432/${POSTGRES_DB:-pengelola_keuangan}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Jakarta}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-IDR}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD:-bot}@db:5432/${POSTGRES_DB:-pengelola_keuangan}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Jakarta}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-IDR}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib di-set di .env}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-43200}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      BILLING_INSTRUCTIONS: ${BILLING_INSTRUCTIONS:-}
    command: ["sh", "-c", "alembic upgrade head && python -m uvicorn pengelola_keuangan.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"]
    expose:
      - "8000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN wajib di-set di .env (e.g. finance-0039.duckdns.org)}
      NGINX_TEMPLATE: ${NGINX_TEMPLATE:-app}
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/templates-src:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    command: >
      sh -c "envsubst '$$DOMAIN' < /etc/nginx/templates-src/$$NGINX_TEMPLATE.conf.template > /etc/nginx/conf.d/default.conf
      && exec nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    restart: "no"
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew --quiet --webroot --webroot-path=/var/www/certbot; sleep 12h & wait $${!}; done"]

  duckdns:
    image: alpine:latest
    restart: unless-stopped
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    command: >
      sh -c "apk add --no-cache curl >/dev/null 2>&1;
             if [ -z \"$$DUCKDNS_SUBDOMAIN\" ] || [ -z \"$$DUCKDNS_TOKEN\" ]; then
               echo 'duckdns: SUBDOMAIN/TOKEN belum di-set, idle.'; sleep infinity;
             fi;
             while true; do
               curl -fsSL \"https://www.duckdns.org/update?domains=$$DUCKDNS_SUBDOMAIN&token=$$DUCKDNS_TOKEN&ip=\" -o /tmp/duck.out || true;
               echo \"duckdns update: $$(cat /tmp/duck.out 2>/dev/null)\";
               sleep 300;
             done"

volumes:
  postgres_data:
