[project]
name = "pengelola-keuangan"
version = "0.1.0"
description = "Bot Telegram pengelola keuangan: catat pemasukan & pengeluaran bulanan, multi-user, dengan budget, chart, recurring, reminder, dan import/export Excel."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "python-telegram-bot[job-queue]>=21",
    "pytz>=2024.1",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-pytz>=2026.2.0.20260506",
]

[project.scripts]
pengelola-keuangan = "pengelola_keuangan.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pengelola_keuangan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # function call in default argument (used by typer/FastAPI)
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "matplotlib.*",
    "telegram.*",
    "openpyxl.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Telegram bot integration code interacts with heavily-generic types from
# python-telegram-bot that don't play nicely with strict mode.
module = ["pengelola_keuangan.bot.*"]
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
